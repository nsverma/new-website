<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us – Instagram</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    color: #262626;
    font-size: 14px;
    min-height: 100vh;
  }

  a { text-decoration: none; color: inherit; }

  /* ── NAVBAR ── */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #fff;
    border-bottom: 1px solid #dbdbdb;
    height: 54px;
    display: flex; align-items: center; justify-content: center;
  }
  .navbar-inner {
    width: 100%; max-width: 975px;
    padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo {
    font-size: 22px; font-style: italic; font-weight: 500;
    color: #262626;
  }
  .nav-back {
    display: flex; align-items: center; gap: 6px;
    color: #0095f6; font-weight: 600; font-size: 14px;
    cursor: pointer;
  }

  /* ── PAGE ── */
  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 80px 20px 40px;
  }

  /* ── CARD ── */
  .card {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    padding: 40px 40px 32px;
  }

  .card-logo {
    text-align: center;
    font-size: 28px; font-style: italic; font-weight: 500;
    margin-bottom: 8px;
    color: #262626;
  }
  .card-subtitle {
    text-align: center;
    color: #8e8e8e;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 24px;
  }

  /* ── FORM ── */
  .form-group {
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #262626;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .form-group label .required {
    color: #ed4956;
    margin-left: 2px;
  }
  .form-group input,
  .form-group textarea {
    width: 100%;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: #262626;
    outline: none;
    transition: border-color .15s;
    resize: none;
  }
  .form-group input::placeholder,
  .form-group textarea::placeholder {
    color: #8e8e8e;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    border-color: #a8a8a8;
    background: #fff;
  }
  .form-group input.error,
  .form-group textarea.error {
    border-color: #ed4956;
  }
  .form-group .error-msg {
    color: #ed4956;
    font-size: 12px;
    margin-top: 4px;
    display: none;
  }
  .form-group.show-error .error-msg { display: block; }
  .form-group.show-error input,
  .form-group.show-error textarea { border-color: #ed4956; }

  .submit-btn {
    width: 100%;
    background: #0095f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity .15s;
  }
  .submit-btn:hover { opacity: .85; }
  .submit-btn:active { opacity: .7; }
  .submit-btn:disabled { opacity: .4; cursor: default; }

  .success-banner {
    display: none;
    background: #d4edda;
    border: 1px solid #b8dfc4;
    border-radius: 6px;
    color: #276037;
    font-size: 14px;
    padding: 12px 16px;
    margin-bottom: 16px;
    text-align: center;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 480px) {
    .page { padding: 70px 0 0; }
    .card { border-radius: 0; border-left: none; border-right: none; padding: 32px 20px 24px; }
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-inner">
    <a class="nav-logo" href="index.html">Instagram</a>
    <a class="nav-back" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0095f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back to feed
    </a>
  </div>
</nav>

<!-- PAGE -->
<div class="page">
  <div class="card">
    <div class="card-logo">Instagram</div>
    <div class="card-subtitle">Contact Us</div>

    <div class="success-banner" id="successBanner">
      Your message has been sent! We'll get back to you soon.
    </div>

    <form id="contactForm" novalidate>

      <!-- Name -->
      <div class="form-group" id="fg-name">
        <label>Name <span class="required">*</span></label>
        <input type="text" id="name" placeholder="Enter your name" autocomplete="name">
        <div class="error-msg">Please enter your name.</div>
      </div>

      <!-- Email -->
      <div class="form-group" id="fg-email">
        <label>Email <span class="required">*</span></label>
        <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
        <div class="error-msg">Please enter a valid email address.</div>
      </div>

      <!-- Phone Number -->
      <div class="form-group" id="fg-phone">
        <label>Phone Number <span class="required">*</span></label>
        <input type="tel" id="phone" placeholder="Enter your phone number" autocomplete="tel">
        <div class="error-msg">Please enter your phone number.</div>
      </div>

      <!-- Date of Birth -->
      <div class="form-group" id="fg-dob">
        <label>Date of Birth <span class="required">*</span></label>
        <input type="date" id="dob" autocomplete="bday">
        <div class="error-msg">Please enter your date of birth.</div>
      </div>

      <!-- City -->
      <div class="form-group" id="fg-city">
        <label>City <span class="required">*</span></label>
        <input type="text" id="city" placeholder="Enter your city" autocomplete="address-level2">
        <div class="error-msg">Please enter your city.</div>
      </div>

      <!-- Message -->
      <div class="form-group" id="fg-message">
        <label>Message <span class="required">*</span></label>
        <textarea id="message" rows="4" placeholder="Write your message…"></textarea>
        <div class="error-msg">Please enter your message.</div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Send Message</button>

    </form>
  </div>
</div>

<script>
  const rules = [
    { id: 'name',    fg: 'fg-name',    validate: v => v.trim().length > 0 },
    { id: 'email',   fg: 'fg-email',   validate: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) },
    { id: 'phone',   fg: 'fg-phone',   validate: v => v.trim().length > 0 },
    { id: 'dob',     fg: 'fg-dob',     validate: v => v.trim().length > 0 },
    { id: 'city',    fg: 'fg-city',    validate: v => v.trim().length > 0 },
    { id: 'message', fg: 'fg-message', validate: v => v.trim().length > 0 },
  ];

  // Clear error on input
  rules.forEach(({ id, fg }) => {
    document.getElementById(id).addEventListener('input', () => {
      document.getElementById(fg).classList.remove('show-error');
    });
  });

  document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    let valid = true;

    rules.forEach(({ id, fg, validate }) => {
      const val = document.getElementById(id).value;
      const fgEl = document.getElementById(fg);
      if (!validate(val)) {
        fgEl.classList.add('show-error');
        valid = false;
      } else {
        fgEl.classList.remove('show-error');
      }
    });

    if (valid) {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      setTimeout(() => {
        document.getElementById('contactForm').reset();
        document.getElementById('successBanner').style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Send Message';
      }, 800);
    }
  });
</script>
</body>
</html>
